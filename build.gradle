plugins { id 'net.fabricmc.fabric-loom' version "${loom_version}" }
version = project.mod_version
group = 'dev.blockwire'
base { archivesName = 'blockwire' }
repositories { maven { url = 'https://maven.terraformersmc.com/releases/' } }
configurations { modMenuContractRuntime }
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    // Optional integration: never bundle Mod Menu or require it at normal runtime.
    compileOnly "com.terraformersmc:modmenu:${modmenu_version}"
    modMenuContractRuntime("com.terraformersmc:modmenu:${modmenu_version}") { transitive = false }
    // Bundle the standard certificate tooling; no keytool executable or JDK-internal APIs.
    for (artifact in ["bcprov-jdk18on", "bcutil-jdk18on", "bcpkix-jdk18on"]) {
        implementation "org.bouncycastle:${artifact}:1.84"
        include "org.bouncycastle:${artifact}:1.84"
    }
}
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25; withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
jar {
    from("LICENSE") { rename { "${it}_blockwire" } }
    from("licenses") { into "META-INF/licenses" }
    from("THIRD_PARTY.md")
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
sourceSets {
    contractTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
tasks.register('contractTest', JavaExec) {
    dependsOn contractTestClasses
    classpath = sourceSets.contractTest.runtimeClasspath
    mainClass = 'dev.blockwire.TransportContractTest'
}
tasks.register("tlsContractTest", JavaExec) {
    dependsOn contractTestClasses
    classpath = sourceSets.contractTest.runtimeClasspath
    mainClass = "dev.blockwire.TlsContractTest"
}
tasks.register("tlsFixture", JavaExec) {
    dependsOn contractTestClasses
    classpath = sourceSets.contractTest.runtimeClasspath
    mainClass = "dev.blockwire.TlsFixture"
    args(project.findProperty("fixtureDir") ?: layout.buildDirectory.dir("tls-fixture").get().asFile.absolutePath)
}
tasks.register("visibilityContractTest", JavaExec) {
    dependsOn contractTestClasses
    classpath = sourceSets.contractTest.runtimeClasspath
    mainClass = "dev.blockwire.VisibilityContractTest"
}
tasks.register("searchContractTest", JavaExec) {
    dependsOn contractTestClasses
    classpath = sourceSets.contractTest.runtimeClasspath
    mainClass = 'dev.blockwire.SearchContractTest'
}
tasks.register("settingsContractTest", JavaExec) {
    dependsOn contractTestClasses
    classpath = sourceSets.contractTest.runtimeClasspath
    mainClass = "dev.blockwire.SettingsContractTest"
}
tasks.register("modMenuContractTest", JavaExec) {
    dependsOn contractTestClasses
    classpath = sourceSets.contractTest.runtimeClasspath + configurations.modMenuContractRuntime
    mainClass = "dev.blockwire.ModMenuContractTest"
}
tasks.register("controllerContractTest", JavaExec) {
    dependsOn contractTestClasses
    classpath = sourceSets.contractTest.runtimeClasspath
    mainClass = "dev.blockwire.ControllerContractTest"
}
tasks.register("commandContractTest", JavaExec) {
    dependsOn contractTestClasses
    classpath = sourceSets.contractTest.runtimeClasspath
    mainClass = "dev.blockwire.CommandContractTest"
}
tasks.register("inventoryContractTest", JavaExec) {
    dependsOn contractTestClasses
    classpath = sourceSets.contractTest.runtimeClasspath
    mainClass = "dev.blockwire.InventoryContractTest"
}
tasks.register("terrainContractTest", JavaExec) {
    dependsOn contractTestClasses
    classpath = sourceSets.contractTest.runtimeClasspath
    mainClass = 'dev.blockwire.TerrainContractTest'
}
tasks.register("motionTraceContractTest", JavaExec) {
    dependsOn contractTestClasses
    classpath = sourceSets.contractTest.runtimeClasspath
    mainClass = 'dev.blockwire.MotionTraceContractTest'
}
tasks.register("rotationContractTest", JavaExec) {
    dependsOn contractTestClasses
    classpath = sourceSets.contractTest.runtimeClasspath
    mainClass = 'dev.blockwire.RotationContractTest'
}
tasks.register("play2CodeContractTest", JavaExec) {
    dependsOn contractTestClasses
    classpath = sourceSets.contractTest.runtimeClasspath
    mainClass = 'dev.blockwire.Play2CodeContractTest'
}
tasks.register("autoEventsContractTest", JavaExec) {
    dependsOn contractTestClasses
    classpath = sourceSets.contractTest.runtimeClasspath
    mainClass = 'dev.blockwire.AutoEventsContractTest'
}
check.dependsOn searchContractTest, autoEventsContractTest, contractTest, tlsContractTest, visibilityContractTest, settingsContractTest, modMenuContractTest, controllerContractTest, commandContractTest, inventoryContractTest, terrainContractTest, motionTraceContractTest, rotationContractTest, play2CodeContractTest
